[project]
name = "docuquery"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.115.6", "uvicorn==0.34.0", "celery==5.4.0", "redis==5.2.1",
  "qdrant-client==1.18.0", "langchain-core==1.4.0",
  "langchain-text-splitters==1.1.2", "langchain-huggingface==1.2.2",
  "sentence-transformers==5.5.1", "langchain-google-genai==4.2.3",
  "pypdf==6.12.2", "docx2txt==0.9", "python-multipart==0.0.20",
  "python-dotenv==1.2.2", "tenacity==9.1.2", "streamlit==1.45.0",
  "requests==2.34.2",
  "torch==2.10.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.2", "httpx==0.28.1", "ruff==0.15.6", "mypy==1.19.1", "types-requests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These modules load environment configuration / establish sys.path before imports.
"src/main.py" = ["E402"]
"src/worker.py" = ["E402"]
"tests/test_api.py" = ["E402"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
