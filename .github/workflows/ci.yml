name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.18.0
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt
      - run: pip check
      - run: pytest tests -q
        env:
          HF_HUB_OFFLINE: '1'
          DOCUQUERY_INTEGRATION: '1'
      - run: ruff check src frontend scripts tests
      - run: mypy src frontend scripts tests --ignore-missing-imports --explicit-package-bases
      - run: docker compose config --quiet
      - run: docker build -t docuquery:ci .
